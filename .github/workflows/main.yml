name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java (JDK 17) مع تفعيل الكاش لسرعة البناء
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. منح صلاحية التشغيل لملف gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. تشغيل الاختبارات السريعة (Unit Tests)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 5. بناء ملف الـ APK (Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. رفع ملف الـ APK الناتج لتتمكن من تحميله بعد اكتمال الـ Workflow
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
